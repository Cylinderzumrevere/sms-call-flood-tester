[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sms-call-flood-tester"
version = "0.6.2"
description = "Layered SMS and voice-gateway flood tester for authorized load testing."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "flood-tester contributors" }]
keywords = ["sms", "voice", "load-test", "flood", "gateway", "pentest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]

dependencies = [
    "httpx>=0.27.0",
    "h2>=4.1.0",
    "websockets>=12.0",
    "pydantic>=2.7.0",
    "tomli>=2.0.1",
    "rich>=13.7.0",
    "typer>=0.12.3",
    "tenacity>=8.3.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.6", "ruff>=0.4.4", "mypy>=1.10.0"]

[project.scripts]
flood = "flood.bootstrap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/flood/core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]